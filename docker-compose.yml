services:
  db:
    image: leogloriainfnet/postgres-tp2-spring:1.0
    container_name: aventura-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./script/aventura.sql:/docker-entrypoint-initdb.d/99_aventura.sql